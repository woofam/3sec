<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
  <title id="title">3초 메뉴 화면 예시</title>
  <desc id="desc">스마트폰 안에 재료 선택과 메뉴 추천 화면이 표현되어 있습니다.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#17345f" flood-opacity=".22"/>
    </filter>
  </defs>
  <circle cx="355" cy="382" r="300" fill="#eaf1ff"/>
  <g transform="translate(178 33) rotate(-4 180 345)" filter="url(#shadow)">
    <rect width="364" height="692" rx="58" fill="#101828"/>
    <rect x="10" y="10" width="344" height="672" rx="49" fill="#f7f9fc"/>
    <rect x="137" y="22" width="90" height="24" rx="12" fill="#101828"/>
    <text x="38" y="92" fill="#101828" font-size="18" font-weight="700" font-family="Arial, sans-serif">3초 메뉴</text>
    <circle cx="318" cy="84" r="16" fill="#e8edf5"/>
    <text x="38" y="147" fill="#101828" font-size="27" font-weight="800" font-family="Arial, sans-serif">지금 있는 재료를</text>
    <text x="38" y="181" fill="#101828" font-size="27" font-weight="800" font-family="Arial, sans-serif">골라주세요</text>
    <g font-family="Arial, sans-serif" font-size="13" font-weight="600">
      <rect x="36" y="214" width="86" height="42" rx="21" fill="#1769ff"/><text x="57" y="240" fill="#fff">🥚 계란</text>
      <rect x="130" y="214" width="84" height="42" rx="21" fill="#1769ff"/><text x="151" y="240" fill="#fff">두부</text>
      <rect x="222" y="214" width="100" height="42" rx="21" fill="#fff" stroke="#dce2ea"/><text x="243" y="240" fill="#4d5a6b">애호박</text>
      <rect x="36" y="266" width="94" height="42" rx="21" fill="#fff" stroke="#dce2ea"/><text x="58" y="292" fill="#4d5a6b">감자</text>
      <rect x="138" y="266" width="100" height="42" rx="21" fill="#fff" stroke="#dce2ea"/><text x="160" y="292" fill="#4d5a6b">당근</text>
    </g>
    <rect x="36" y="343" width="292" height="69" rx="20" fill="#1769ff"/>
    <text x="182" y="386" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" font-family="Arial, sans-serif">3초 만에 결정하기</text>
    <rect x="36" y="448" width="292" height="176" rx="28" fill="#fff"/>
    <circle cx="88" cy="502" r="30" fill="#fff1c7"/>
    <text x="88" y="513" text-anchor="middle" font-size="29">🍳</text>
    <text x="134" y="491" fill="#7a8798" font-size="12" font-family="Arial, sans-serif">오늘의 3초 메뉴</text>
    <text x="134" y="523" fill="#101828" font-size="21" font-weight="800" font-family="Arial, sans-serif">두부 계란전</text>
    <rect x="64" y="558" width="236" height="40" rx="14" fill="#edf3ff"/>
    <text x="182" y="583" text-anchor="middle" fill="#1769ff" font-size="13" font-weight="700" font-family="Arial, sans-serif">장보기 목록에 담기</text>
  </g>
  <g transform="translate(482 106)">
    <rect width="150" height="54" rx="27" fill="#fff"/>
    <circle cx="28" cy="27" r="16" fill="#1769ff"/>
    <path d="M21 27h14M28 20v14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="55" y="33" fill="#101828" font-size="14" font-weight="700" font-family="Arial, sans-serif">빠른 선택</text>
  </g>
  <g transform="translate(64 565)">
    <rect width="162" height="54" rx="27" fill="#101828"/>
    <text x="81" y="33" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="Arial, sans-serif">Local-first</text>
  </g>
